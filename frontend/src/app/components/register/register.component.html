<div class="auth-wrapper">
  <form class="auth-card" (ngSubmit)="onSubmit()">
    <h1>Create account</h1>
    <p class="subtitle">Sign up to start tracking your tasks</p>

    <label for="name">Name</label>
    <input id="name" type="text" name="name" [(ngModel)]="name" placeholder="Your name" />

    <label for="email">Email</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="At least 6 characters" />

    <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Register' }}
    </button>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </form>
</div>
